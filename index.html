<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mughal Birds Farm</ title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ============================================================
   MUGHAL BIRDS FARM — DESIGN TOKENS
   Palette: aviary dusk. Deep pine (#1B3A2B) + warm brass (#C89B3C)
   on soft feather cream (#F6F2E8), with dove-slate (#4A6670) and
   a clay-red status accent (#B5473A). Display face Fraunces
   (warm, slightly humanist serif — feels like ledger/registry
   typography), body Inter, data/IDs in JetBrains Mono.
   Signature: a hand-drawn "wing ledger" divider + soft aviary
   grid texture used sparingly behind empty states.
   ============================================================ */
:root{
  --pine-950:#0F251B;
  --pine-900:#16332580;
  --pine:#1B3A2B;
  --pine-700:#254A38;
  --pine-100:#DCE9E0;
  --brass:#C89B3C;
  --brass-600:#A87F2A;
  --brass-100:#F4E7C8;
  --cream:#F6F2E8;
  --cream-100:#FFFDF8;
  --slate:#4A6670;
  --slate-100:#E3EAEC;
  --clay:#B5473A;
  --clay-100:#F6DEDA;
  --ok:#2E7D53;
  --ok-100:#DBEFE2;
  --ink:#1D2420;
  --ink-soft:#5B655F;
  --line:#E4DDC9;
  --radius:16px;
  --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(27,58,43,.06);
  --shadow-md:0 8px 24px -8px rgba(27,58,43,.18);
  --shadow-lg:0 20px 48px -12px rgba(27,58,43,.28);
  --font-display:'Fraunces',serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}
}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--brass-100);}
:focus-visible{outline:2.5px solid var(--brass-600);outline-offset:2px;}

.hidden{display:none !important;}

/* ---------- feather texture ---------- */
.feather-bg{
  background-image:
    radial-gradient(circle at 20% 20%, rgba(27,58,43,.035) 0, transparent 40%),
    radial-gradient(circle at 80% 60%, rgba(200,155,60,.05) 0, transparent 45%);
}

/* ---------- AUTH SCREEN ---------- */
#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    linear-gradient(180deg, var(--pine-950) 0%, var(--pine) 62%, var(--pine-700) 100%);
  position:relative;
  overflow:hidden;
}
#authScreen::before{
  content:"";
  position:absolute;inset:0;
  background-image:
    repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(25deg, rgba(255,255,255,.02) 0 1px, transparent 1px 64px);
  pointer-events:none;
}
.auth-card{
  position:relative;
  width:100%;max-width:408px;
  background:var(--cream-100);
  border-radius:22px;
  box-shadow:var(--shadow-lg);
  padding:36px 30px 28px;
}
.auth-brand{text-align:center;margin-bottom:22px;}
.auth-brand .mark{
  width:56px;height:56px;border-radius:16px;
  background:linear-gradient(155deg,var(--brass) 0%, var(--brass-600) 100%);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;color:var(--pine-950);font-size:24px;
  box-shadow:0 8px 20px -6px rgba(200,155,60,.55);
}
.auth-brand h1{
  font-family:var(--font-display);font-weight:600;font-size:24px;margin:0;color:var(--pine);letter-spacing:.2px;
}
.auth-brand p{margin:4px 0 0;color:var(--ink-soft);font-size:13px;letter-spacing:.4px;text-transform:uppercase;}
.auth-tabs{display:flex;background:var(--slate-100);border-radius:12px;padding:4px;margin-bottom:22px;}
.auth-tabs button{
  flex:1;border:0;background:transparent;padding:10px 0;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-soft);transition:all .2s;
}
.auth-tabs button.active{background:var(--cream-100);color:var(--pine);box-shadow:var(--shadow-sm);}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.2px;}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;
  background:var(--cream-100);font-size:15px;color:var(--ink);transition:border-color .15s, box-shadow .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brass-600);box-shadow:0 0 0 4px rgba(200,155,60,.15);}
.field textarea{resize:vertical;min-height:70px;}
.btn{
  border:none;border-radius:11px;padding:13px 18px;font-weight:700;font-size:14.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s, box-shadow .12s, background .15s;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--pine);color:var(--cream-100);width:100%;box-shadow:0 8px 20px -8px rgba(27,58,43,.5);}
.btn-primary:hover{background:var(--pine-700);}
.btn-gold{background:linear-gradient(155deg,var(--brass) 0%,var(--brass-600) 100%);color:var(--pine-950);}
.btn-gold:hover{filter:brightness(1.05);}
.btn-ghost{background:transparent;color:var(--pine);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--pine);}
.btn-danger{background:var(--clay);color:#fff;}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:9px;}
.btn-block{width:100%;}
.auth-link{display:block;text-align:center;margin-top:16px;font-size:13.5px;color:var(--slate);font-weight:600;background:none;border:none;}
.auth-error{
  background:var(--clay-100);color:var(--clay);border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:14px;font-weight:600;display:flex;gap:8px;align-items:flex-start;
}
.auth-note{background:var(--brass-100);color:#7A5A18;border-radius:10px;padding:10px 13px;font-size:12.5px;margin-top:14px;line-height:1.5;}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh;}
#app.active{display:flex;}
.sidebar{
  width:248px;flex-shrink:0;background:var(--pine);color:var(--cream);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:60;
}
.sidebar-brand{padding:22px 20px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.09);}
.sidebar-brand .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(155deg,var(--brass),var(--brass-600));display:flex;align-items:center;justify-content:center;color:var(--pine-950);font-size:17px;flex-shrink:0;}
.sidebar-brand h1{font-family:var(--font-display);font-size:16.5px;margin:0;font-weight:600;line-height:1.2;}
.sidebar-brand span{font-size:10.5px;color:var(--brass-100);opacity:.8;letter-spacing:.5px;text-transform:uppercase;}
.sync-pill{margin:14px 16px 4px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.06);}
.sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sync-dot.on{background:#3FCE7E;box-shadow:0 0 0 3px rgba(63,206,126,.25);}
.sync-dot.off{background:#E8A23A;box-shadow:0 0 0 3px rgba(232,162,58,.25);}
.sync-dot.err{background:#E85C4A;box-shadow:0 0 0 3px rgba(232,92,74,.25);}
.nav{flex:1;padding:10px 12px;overflow-y:auto;}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:rgba(246,242,232,.45);margin:16px 12px 6px;font-weight:700;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;color:rgba(246,242,232,.82);
  cursor:pointer;transition:background .15s,color .15s;margin-bottom:2px;
}
.nav-item i{width:18px;text-align:center;font-size:15px;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:var(--brass);color:var(--pine-950);}
.sidebar-foot{padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.09);}
.user-chip{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.user-chip .av{width:34px;height:34px;border-radius:50%;background:var(--brass-100);color:var(--pine);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
.user-chip .em{font-size:12px;color:rgba(246,242,232,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;}
.logout-btn{width:100%;background:rgba(255,255,255,.08);color:var(--cream);border:none;border-radius:9px;padding:9px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;}
.logout-btn:hover{background:rgba(255,255,255,.15);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(246,242,232,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:14px;
}
.hamburger{display:none;background:none;border:none;font-size:20px;color:var(--pine);padding:4px;cursor:pointer;}
.sidebar-close{display:none;margin-left:auto;background:rgba(255,255,255,.09);border:0;color:var(--cream);width:34px;height:34px;border-radius:9px;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;}
.sidebar-close:hover{background:rgba(255,255,255,.16);}
.topbar h2{font-family:var(--font-display);font-size:20px;margin:0;font-weight:600;color:var(--pine);flex:1;}
.topbar-search{position:relative;width:260px;max-width:40vw;}
.topbar-search input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream-100);font-size:13.5px;}
.topbar-search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:13px;}
.content{padding:22px 24px 60px;max-width:1280px;width:100%;margin:0 auto;}

.overlay{position:fixed;inset:0;background:rgba(15,37,27,.5);z-index:50;display:none;}
.overlay.show{display:block;}

/* ---------- Cards / stats ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;margin-bottom:26px;}
.stat-card{background:var(--cream-100);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s;cursor:pointer;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.stat-card .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:15px;}
.stat-card .val{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--pine);line-height:1;}
.stat-card .lbl{font-size:12px;color:var(--ink-soft);margin-top:5px;font-weight:600;}

.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 14px;flex-wrap:wrap;}
.section-head h3{font-family:var(--font-display);font-size:18px;margin:0;color:var(--pine);font-weight:600;}
.wing-divider{border:none;border-top:1px dashed var(--line);margin:26px 0;}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.entity-card{background:var(--cream-100);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;}
.entity-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.entity-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.entity-card h4{margin:0 0 3px;font-size:15.5px;font-weight:700;color:var(--pine);}
.entity-card .mono{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);}
.entity-card .meta{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.2px;}
.badge-green{background:var(--ok-100);color:var(--ok);}
.badge-red{background:var(--clay-100);color:var(--clay);}
.badge-gold{background:var(--brass-100);color:#8A6414;}
.badge-slate{background:var(--slate-100);color:var(--slate);}
.badge-pine{background:var(--pine-100);color:var(--pine);}

/* ---------- Table (desktop) / card list (mobile) ---------- */
.table-wrap{background:var(--cream-100);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);}
table.dtable{width:100%;border-collapse:collapse;}
.dtable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);padding:12px 16px;background:var(--pine-100);font-weight:700;}
.dtable td{padding:12px 16px;font-size:13.5px;border-top:1px solid var(--line);vertical-align:middle;}
.dtable tr{cursor:pointer;}
.dtable tr:hover td{background:rgba(200,155,60,.06);}
.row-actions{display:flex;gap:6px;}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--cream-100);display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--slate);}
.icon-btn:hover{background:var(--slate-100);}
.icon-btn.danger:hover{background:var(--clay-100);color:var(--clay);border-color:var(--clay-100);}

@media (max-width:760px){
  .dtable thead{display:none;}
  .dtable, .dtable tbody, .dtable tr, .dtable td{display:block;width:100%;}
  .dtable tr{border-top:1px solid var(--line);padding:12px 14px;}
  .dtable td{border:none;padding:3px 0;font-size:13.5px;}
  .dtable td::before{content:attr(data-label);display:inline-block;min-width:96px;font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:700;letter-spacing:.4px;}
}

/* ---------- Empty state ---------- */
.empty-state{
  text-align:center;padding:52px 24px;background:var(--cream-100);border:1px dashed var(--line);border-radius:var(--radius);
}
.empty-state .emoji{font-size:38px;margin-bottom:10px;}
.empty-state h4{font-family:var(--font-display);font-size:18px;color:var(--pine);margin:0 0 6px;}
.empty-state p{color:var(--ink-soft);font-size:13.5px;margin:0 0 18px;max-width:360px;margin-left:auto;margin-right:auto;line-height:1.5;}

/* ---------- Quick actions ---------- */
.qa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.qa-btn{background:var(--cream-100);border:1px solid var(--line);border-radius:13px;padding:14px 10px;text-align:center;box-shadow:var(--shadow-sm);transition:transform .15s;}
.qa-btn:hover{transform:translateY(-2px);border-color:var(--brass);}
.qa-btn i{font-size:18px;color:var(--brass-600);margin-bottom:6px;display:block;}
.qa-btn span{font-size:12px;font-weight:700;color:var(--pine);}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,37,27,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;}
.modal-backdrop.show{display:flex;}
.modal{background:var(--cream-100);border-radius:20px;max-width:560px;width:100%;box-shadow:var(--shadow-lg);margin-bottom:5vh;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line);}
.modal-head h3{font-family:var(--font-display);font-size:18px;margin:0;color:var(--pine);}
.modal-close{background:var(--slate-100);border:none;width:30px;height:30px;border-radius:9px;color:var(--slate);font-size:13px;}
.modal-body{padding:20px 22px;max-height:64vh;overflow-y:auto;}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
@media (max-width:520px){.two-col{grid-template-columns:1fr;}}
.field-error{color:var(--clay);font-size:11.5px;margin-top:4px;font-weight:600;}

/* ---------- Toasts ---------- */
#toastWrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:320px;}
.toast{background:var(--pine);color:var(--cream-100);padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:toastIn .25s ease;}
.toast.error{background:var(--clay);}
.toast.success{background:var(--ok);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Detail/profile ---------- */
.profile-head{display:flex;gap:16px;align-items:center;background:var(--cream-100);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;flex-wrap:wrap;}
.profile-photo{width:76px;height:76px;border-radius:16px;background:var(--pine-100);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--pine);flex-shrink:0;overflow:hidden;}
.profile-photo img{width:100%;height:100%;object-fit:cover;}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:18px;}
.info-item{background:var(--cream-100);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.info-item .k{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:700;letter-spacing:.4px;margin-bottom:3px;}
.info-item .v{font-size:14px;font-weight:700;color:var(--pine);}

.pill-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.pill-tabs button{border:1.5px solid var(--line);background:var(--cream-100);padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:700;color:var(--slate);}
.pill-tabs button.active{background:var(--pine);border-color:var(--pine);color:var(--cream-100);}

.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.filter-bar select,.filter-bar input{padding:9px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--cream-100);font-size:13px;}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--slate);font-weight:700;font-size:13px;margin-bottom:14px;background:none;border:none;}
.back-link:hover{color:var(--pine);}

.welcome-hero{text-align:center;padding:60px 20px;background:linear-gradient(180deg,rgba(200,155,60,.08),transparent);border-radius:var(--radius);margin-bottom:20px;}
.welcome-hero .mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(155deg,var(--brass),var(--brass-600));display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--pine-950);margin:0 auto 16px;}
.welcome-hero h2{font-family:var(--font-display);font-size:26px;color:var(--pine);margin:0 0 8px;}
.welcome-hero p{color:var(--ink-soft);font-size:14.5px;max-width:420px;margin:0 auto 22px;line-height:1.6;}

.spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.helper-text{font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.4;}

@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--shadow-lg);z-index:60;}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:inline-flex;}
  .sidebar-close{display:flex;}
  .topbar-search{width:150px;}
  .content{padding:16px 14px 60px;}
}
</style>
</head>
<body>

<!-- ============================================================
     AUTH SCREEN
============================================================ -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="mark"><i class="fa-solid fa-dove"></i></div>
      <h1>Mughal Birds Farm</h1>
      <p>Bird &amp; Animal Management</p>
    </div>

    <div id="authError" class="auth-error hidden"><i class="fa-solid fa-triangle-exclamation" style="margin-top:2px;"></i><span id="authErrorText"></span></div>
    <div id="authInfo" class="auth-note hidden"></div>

    <!-- Login -->
    <div id="loginPane">
      <div class="auth-tabs">

const state = {

/* ============================================================

============================================================ */
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));
const uid4 = () => Math.random().toString(36).slice(2,6).toUpperCase();
const genId = (prefix) => `${prefix}-${Date.now().toString(36).toUpperCase()}${uid4()}`;
const esc = (s) => (s===undefined||s===null) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = (v) => { if(!v) return "—"; try{ const d = v.toDate ? v.toDate() : new Date(v); return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }catch(e){ return "—"; } };
const fmtMoney = (n) => (n===undefined||n===null||n==="") ? "—" : `Rs ${Number(n).toLocaleString()}`;

function toast(msg, type="info"){
  const wrap = $("#toastWrap");
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  const icon = type==="error" ? "fa-circle-exclamation" : type==="success" ? "fa-circle-check" : "fa-circle-info";
  el.innerHTML = `<i class="fa-solid ${icon}"></i><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transform="translateY(6px)"; el.style.transition="all .25s"; setTimeout(()=>el.remove(),250); }, 3400);
}
function friendlyAuthError(err){
  const map = {
    "auth/invalid-email":"That email address doesn't look right.",
    "auth/user-not-found":"No account found with that email.",
    "auth/wrong-password":"Incorrect password. Please try again.",
    "auth/invalid-credential":"Incorrect email or password.",
    "auth/email-already-in-use":"An account already exists with that email.",
    "auth/weak-password":"Password should be at least 6 characters.",
    "auth/too-many-requests":"Too many attempts. Please wait a moment and try again.",
    "auth/network-request-failed":"Network error. Check your connection and try again."
  };
  return map[err?.code] || "Something went wrong. Please try again.";
}

/* ============================================================

function showAuthPane(pane){

function hideAuthMsgs(){ $("#authError").classList.add("hidden"); $("#authInfo").classList.add("hidden"); }

onAuthStateChanged(auth, (user)=>{
  if(user){

  } else {

    Object.keys(state.data).forEach(k=>state.data[k]=[]);
    Object.keys(state.loaded).forEach(k=>state.loaded[k]=false);

/* ============================================================
   DATA SERVICE — single Firestore layer for every entity
============================================================ */
function colRef(name){ return collection(db, `users/${state.uid}/${name}`); }
function docRef(name,id){ return doc(db, `users/${state.uid}/${name}/${id}`); }

function attachListeners(){
  detachListeners();
  updateSyncPill("connecting");
  COLLECTIONS.forEach(name=>{
    const q = query(colRef(name));
    const unsub = onSnapshot(q, (snap)=>{
      state.data[name] = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      state.loaded[name] = true;
      state.fromCache = snap.metadata.fromCache;
      updateSyncPill(snap.metadata.fromCache ? "offline" : "online");
      if(name==="species" && state.data.species.length===0){ /* first-run handled in render */ }
      render();
    }, (err)=>{
      console.error("Firestore listen error", name, err);
      updateSyncPill("error");
      toast(`Unable to load ${name}. Check your connection.`, "error");
    });
    state.unsubs.push(unsub);
  });
  window.addEventListener("online", ()=>updateSyncPill(state.fromCache?"offline":"online"));
  window.addEventListener("offline", ()=>updateSyncPill("offline"));
}
function detachListeners(){ state.unsubs.forEach(u=>u()); state.unsubs = []; }

function updateSyncPill(status){
  const dot = $("#syncDot"), label = $("#syncLabel");
  if(!dot) return;
  dot.className = "sync-dot";
  if(status==="online" && navigator.onLine){ dot.classList.add("on"); label.textContent = "Connected"; }
  else if(status==="connecting"){ dot.classList.add("off"); label.textContent = "Connecting…"; }
  else if(status==="offline" || !navigator.onLine){ dot.classList.add("off"); label.textContent = "Offline · cached data"; }
  else { dot.classList.add("err"); label.textContent = "Connection problem"; }
}

async function logActivity(message, icon="fa-circle-info"){
  try{ await addDoc(colRef("activity"), { message, icon, createdAt: serverTimestamp() }); }
  catch(e){ console.error("activity log failed", e); }
}

const DataService = {
  async create(name, data){
    try{
      const ref = await addDoc(colRef(name), { ...data, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      return ref.id;
    }catch(e){ console.error(e); toast(`Unable to save. Please check your connection.`,"error"); throw e; }
  },
  async createWithId(name, id, data){
    try{ await setDoc(docRef(name,id), { ...data, createdAt: serverTimestamp(), updatedAt: serverTimestamp() }); return id; }
    catch(e){ console.error(e); toast(`Unable to save. Please check your connection.`,"error"); throw e; }
  },
  async update(name, id, data){
    try{ await updateDoc(docRef(name,id), { ...data, updatedAt: serverTimestamp() }); }
    catch(e){ console.error(e); toast(`Unable to save changes. Please check your connection.`,"error"); throw e; }
  },
  async remove(name, id){
    try{ await deleteDoc(docRef(name,id)); }
    catch(e){ console.error(e); toast(`Unable to delete. Please check your connection.`,"error"); throw e; }
  }
};

function render(){

    if(detailTarget.type==="box") return renderBoxDetail(c, detailTarget.id);
    if(detailTarget.type==="offspring") return renderOffspringDetail(c, detailTarget.id);
    if(detailTarget.type==="species") return renderSpeciesDetail(c, detailTarget.id);

  switch(state.view){
    case "dashboard": return renderDashboard(c);
    case "animals": return renderAnimals(c);
    case "pairs": return renderPairs(c);
    case "colonies": return renderColonies(c);
    case "boxes": return renderBoxes(c);
    case "offspring": return renderOffspring(c);
    case "species": return renderSpecies(c);
    case "sales": return renderSales(c);
    case "statistics": return renderStatistics(c);
    case "search": return renderSearch(c);
    case "backup": return renderBackup(c);
    case "settings": return renderSettings(c);
    default: return renderDashboard(c);
  }
}

async function seedStarterProgramme(){
  const btn = $("#seedBtn"); if(btn){ setBtnLoading(btn,true); }
  try{
    const batch = writeBatch(db);
    const speciesIds = {};
    STARTER_SPECIES.forEach(sp=>{
      const ref = doc(colRef("species"));
      speciesIds[sp.name] = ref.id;
      batch.set(ref, {
        name: sp.name, common: sp.common, category: sp.category,
        mutationTracking: sp.mutationTracking, sexTracking: sp.sexTracking,
        breedingSupport: sp.breedingSupport, colonySupport: sp.colonySupport,
        defaultColor: sp.defaultColor || "", notes: "", status:"Active",
        createdAt: serverTimestamp(), updatedAt: serverTimestamp()
      });
    });
    STARTER_SPECIES.forEach(sp=>{
      for(let i=1;i<=sp.pairs;i++){
        const pref = doc(colRef("breedingPairs"));
        batch.set(pref, {
          pairId: `${sp.name.slice(0,3).toUpperCase()}-${String(i).padStart(2,"0")}`,
          speciesId: speciesIds[sp.name], maleId:null, femaleId:null,
          maleMutation:"", femaleMutation:"", cage:"", breedingBoxId:null,
          breedingStatus:"Non-Breeding", startDate:null, notes:"", status:"Active",
          createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        });
      }
    });
    await batch.commit();
    await logActivity(`Starter breeding programme loaded: ${STARTER_SPECIES.reduce((s,x)=>s+x.pairs,0)} pairs across ${STARTER_SPECIES.length} species.`, "fa-seedling");
    toast("Starter programme loaded.","success");
  }catch(e){ console.error(e); toast("Unable to set up starter programme. Please check your connection.","error"); }
  finally{ if(btn) setBtnLoading(btn,false,`<i class="fa-solid fa-seedling"></i> Set Up Starter Programme`); }
}

function bindQuickActions(c){

function openPairForm(existing){
  const isEdit = !!existing;
  const d = existing || {};
  const speciesAnimals = (spId, sex) => state.data.animals.filter(a=>a.speciesId===spId && (sex? a.sex===sex : true));
  openModal(isEdit?"Edit Pair":"Add Breeding Pair", `
    <div class="two-col">
      <div class="field"><label>Pair ID</label><input id="f_pid" value="${esc(d.pairId||genId('PAIR'))}"></div>
      <div class="field"><label>Species *</label><select id="f_sp">${selectOptions(state.data.species,d.speciesId,s=>s.common||s.name)}</select></div>
    </div>
    <div class="two-col">
      <div class="field"><label>Male</label><select id="f_male">${selectOptions(speciesAnimals(d.speciesId), d.maleId, a=>a.animalId||a.id)}</select><div class="helper-text" id="maleHelp"></div></div>
      <div class="field"><label>Female</label><select id="f_female">${selectOptions(speciesAnimals(d.speciesId), d.femaleId, a=>a.animalId||a.id)}</select><div class="helper-text" id="femaleHelp"></div></div>
    </div>
    <div class="two-col">
      <div class="field"><label>Cage</label><input id="f_cage" value="${esc(d.cage||"")}"></div>
      <div class="field"><label>Breeding Box</label><select id="f_box">${selectOptions(state.data.breedingBoxes,d.breedingBoxId,b=>b.boxNumber||b.id,b=>b.id,"None")}</select></div>
    </div>
    <div class="two-col">
      <div class="field"><label>Breeding Status</label><select id="f_status">${["Non-Breeding","Breeding","Retired"].map(o=>`<option ${(d.breedingStatus||"Non-Breeding")===o?"selected":""}>${o}</option>`).join("")}</select></div>
      <div class="field"><label>Start Date</label><input type="date" id="f_start" value="${d.startDate||""}"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="f_notes">${esc(d.notes||"")}</textarea></div>
  `, `<button class="btn btn-ghost" id="cancelBtn">Cancel</button><button class="btn btn-primary" id="saveBtn">${isEdit?"Save Changes":"Add Pair"}</button>`);

  const refreshAnimalOptions = ()=>{
    const spId = $("#f_sp").value;
    $("#f_male").innerHTML = selectOptions(speciesAnimals(spId), d.maleId, a=>a.animalId||a.id, a=>a.id, "No male registered yet");
    $("#f_female").innerHTML = selectOptions(speciesAnimals(spId), d.femaleId, a=>a.animalId||a.id, a=>a.id, "No female registered yet");
  };
  $("#f_sp").addEventListener("change", refreshAnimalOptions);
  $("#cancelBtn").addEventListener("click", closeModal);
  $("#saveBtn").addEventListener("click", async ()=>{
    const speciesId = $("#f_sp").value;
    if(!speciesId){ toast("Please select a species.","error"); return; }
    const maleId = $("#f_male").value||null, femaleId = $("#f_female").value||null;
    // Prevent duplicate active-pair assignment unless confirmed
    if(maleId){
      const conflict = state.data.breedingPairs.find(p=>p.maleId===maleId && p.id!==(existing?.id) && p.breedingStatus==="Breeding");
      if(conflict && !confirm(`This male is already actively paired in ${conflict.pairId||conflict.id}. Assign anyway?`)) return;
    }
    if(femaleId){
      const conflict = state.data.breedingPairs.find(p=>p.femaleId===femaleId && p.id!==(existing?.id) && p.breedingStatus==="Breeding");
      if(conflict && !confirm(`This female is already actively paired in ${conflict.pairId||conflict.id}. Assign anyway?`)) return;
    }
    const payload = {
      pairId: $("#f_pid").value.trim()||genId("PAIR"), speciesId, maleId, femaleId,
      maleMutation: maleId ? (byId(state.data.animals,maleId)?.mutation||"") : "",
      femaleMutation: femaleId ? (byId(state.data.animals,femaleId)?.mutation||"") : "",
      cage: $("#f_cage").value.trim(), breedingBoxId: $("#f_box").value||null,
      breedingStatus: $("#f_status").value, startDate: $("#f_start").value||null, notes: $("#f_notes").value.trim(),
      status: d.status || "Active"
    };
    try{
      if(isEdit){ await DataService.update("breedingPairs", existing.id, payload); await logActivity(`Pair updated: ${payload.pairId}`,"fa-pen"); toast("Pair updated.","success"); }
      else{ await DataService.create("breedingPairs", payload); await logActivity(`Pair created: ${payload.pairId}`,"fa-heart"); toast("Pair added.","success"); }
      closeModal(); render();
    }catch(e){}
  });
}

function openSaleForm(existing, presetTarget){
  const animalsAndChicks = [
    ...state.data.animals.filter(a=>a.soldStatus!=="Sold").map(a=>({...a, _kind:"animals", _label:a.animalId||a.id})),
    ...state.data.offspring.filter(o=>o.soldStatus!=="Sold").map(o=>({...o, _kind:"offspring", _label:o.offspringId||o.id}))
  ];
  openModal("Record Sale", `
    <div class="field"><label>Animal / Chick *</label><select id="f_target">${selectOptions(animalsAndChicks, presetTarget?.record?.id, x=>`${x._label} (${x._kind==="animals"?"Animal":"Chick"})`, x=>`${x._kind}:${x.id}`)}</select></div>
    <div class="two-col">
      <div class="field"><label>Buyer Name</label><input id="f_buyer"></div>
      <div class="field"><label>Sale Price</label><input type="number" id="f_price"></div>
    </div>
    <div class="field"><label>Sale Date</label><input type="date" id="f_date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Notes</label><textarea id="f_notes"></textarea></div>
  `, `<button class="btn btn-ghost" id="cancelBtn">Cancel</button><button class="btn btn-primary" id="saveBtn">Record Sale</button>`);
  $("#cancelBtn").addEventListener("click", closeModal);
  $("#saveBtn").addEventListener("click", async ()=>{
    const targetVal = $("#f_target").value;
    if(!targetVal){ toast("Please select an animal or chick.","error"); return; }
    const [kind, id] = targetVal.split(":");
    const record = kind==="animals" ? byId(state.data.animals,id) : byId(state.data.offspring,id);
    if(!record){ toast("Record not found.","error"); return; }
    const payload = {
      saleId: genId("SALE"), recordType: kind, recordId: id, recordLabel: record.animalId||record.offspringId||id,
      speciesId: record.speciesId||null, buyerName: $("#f_buyer").value.trim(), salePrice: $("#f_price").value?Number($("#f_price").value):null,
      saleDate: $("#f_date").value||null, notes: $("#f_notes").value.trim()
    };
    try{
      await DataService.create("sales", payload);
      await DataService.update(kind, id, { soldStatus:"Sold", saleDate: payload.saleDate, salePrice: payload.salePrice });
      await logActivity(`Marked sold: ${payload.recordLabel} to ${payload.buyerName||"buyer"}`,"fa-sack-dollar");
      toast("Sale recorded.","success");
      closeModal(); render();
    }catch(e){}
  });
}

function renderSearch(c, presetTerm){
  const term = presetTerm !== undefined ? presetTerm : (state._searchTerm||"");
  state._searchTerm = term;
  c.innerHTML = `
    <div class="field" style="max-width:420px;"><label>Search across all records</label><input id="searchInput" placeholder="Animal ID, Pair ID, Chick ID, species, mutation, color, cage, box, colony…" value="${esc(term)}"></div>
    <div id="searchResults"></div>
  `;
  $("#searchInput").addEventListener("input", (e)=>{ state._searchTerm = e.target.value; runSearch(e.target.value); });
  $("#searchInput").focus();
  runSearch(term);
}
function runSearch(term){
  const t = term.trim().toLowerCase();
  const results = $("#searchResults");
  if(!results) return;
  if(!t){ results.innerHTML = `<div class="empty-state"><div class="emoji">🔎</div><h4>Search your farm</h4><p>Start typing to search animals, pairs, chicks, colonies, boxes and species.</p></div>`; return; }
  const matchers = [
    { arr: state.data.animals, kind:"animal", label:x=>x.animalId||x.id, sub:x=>speciesName(x.speciesId), fields:x=>[x.animalId,x.mutation,x.color,x.cage] },
    { arr: state.data.breedingPairs, kind:"pair", label:x=>x.pairId||x.id, sub:x=>speciesName(x.speciesId), fields:x=>[x.pairId,x.cage] },
    { arr: state.data.offspring, kind:"offspring", label:x=>x.offspringId||x.id, sub:x=>speciesName(x.speciesId), fields:x=>[x.offspringId,x.mutation,x.color,x.cage] },
    { arr: state.data.colonies, kind:"colony", label:x=>x.name, sub:x=>speciesName(x.speciesId), fields:x=>[x.name,x.cage] },
    { arr: state.data.breedingBoxes, kind:"box", label:x=>x.boxNumber||x.id, sub:x=>speciesName(x.speciesId), fields:x=>[x.boxNumber] },
    { arr: state.data.species, kind:"species", label:x=>x.common||x.name, sub:x=>x.category, fields:x=>[x.name,x.common] },
  ];
  let matches = [];
  matchers.forEach(m=>{ m.arr.forEach(x=>{ if(m.fields(x).filter(Boolean).join(" ").toLowerCase().includes(t)){ matches.push({kind:m.kind, id:x.id, label:m.label(x), sub:m.sub(x)}); } }); });
  if(!matches.length){ results.innerHTML = `<div class="empty-state"><div class="emoji">🔎</div><h4>No results</h4><p>Nothing matches "${esc(term)}".</p></div>`; return; }
  results.innerHTML = `<div class="table-wrap"><table class="dtable"><tbody>${matches.map(m=>`
    <tr data-search-row="${m.kind}:${m.id}"><td style="width:80px;"><span class="badge badge-pine">${m.kind}</span></td><td><strong>${esc(m.label)}</strong></td><td style="text-align:right;color:var(--ink-soft);">${esc(m.sub)}</td></tr>`).join("")}</tbody></table></div>`;
  $$("[data-search-row]",results).forEach(r=>r.addEventListener("click",()=>{
    const [kind,id] = r.dataset.searchRow.split(":");
    detailTarget = { type:kind, id }; render();
  }));
}

function renderBackup(c){
  c.innerHTML = `
    <div class="section-head"><h3>Export Database</h3></div>
    <div class="entity-card" style="cursor:default;max-width:480px;">
      <p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 14px;">Download a complete backup of your farm data as JSON, including species, animals, pairs, colonies, boxes, offspring, sales and activity.</p>
      <button class="btn btn-gold" id="exportBtn"><i class="fa-solid fa-download"></i> Export mughal-birds-farm-backup.json</button>
    </div>
    <div class="wing-divider"></div>
    <div class="section-head"><h3>Import Database</h3></div>
    <div class="entity-card" style="cursor:default;max-width:480px;">
      <p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 14px;">Import a previously exported backup file. You'll see a preview and record counts before anything is written to Firestore.</p>
      <input type="file" id="importFile" accept="application/json" style="margin-bottom:12px;">
      <div id="importPreview"></div>
    </div>
  `;
  $("#exportBtn").addEventListener("click", ()=>{
    const payload = { exportedAt: new Date().toISOString(), uid: state.uid, data: state.data };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "mughal-birds-farm-backup.json"; a.click();
    URL.revokeObjectURL(url);
    toast("Backup downloaded.","success");
  });
  $("#importFile").addEventListener("change", async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);
      if(!parsed.data || typeof parsed.data !== "object") throw new Error("Invalid backup structure.");
      const counts = COLLECTIONS.map(name=>({ name, count: Array.isArray(parsed.data[name]) ? parsed.data[name].length : 0 }));
      $("#importPreview").innerHTML = `
        <div class="table-wrap" style="margin-bottom:12px;"><table class="dtable"><tbody>
          ${counts.map(c=>`<tr><td data-label="Collection">${c.name}</td><td data-label="Records" style="text-align:right;">${c.count} record(s)</td></tr>`).join("")}
        </tbody></table></div>
        <button class="btn btn-primary" id="confirmImportBtn"><i class="fa-solid fa-cloud-arrow-up"></i> Write to Firestore</button>`;
      $("#confirmImportBtn").addEventListener("click", async ()=>{
        if(!confirm("This will add the imported records to your Firestore database. Continue?")) return;
        const btn = $("#confirmImportBtn"); setBtnLoading(btn,true);
        try{
          for(const name of COLLECTIONS){
            const arr = Array.isArray(parsed.data[name]) ? parsed.data[name] : [];
            const batch = writeBatch(db);
            arr.forEach(rec=>{
              const { id, ...rest } = rec;
              const ref = id ? doc(colRef(name), id) : doc(colRef(name));
              batch.set(ref, { ...rest, updatedAt: serverTimestamp() }, { merge:true });
            });
            if(arr.length) await batch.commit();
          }
          await logActivity("Database imported from backup file.","fa-cloud-arrow-up");
          toast("Import complete.","success");
          $("#importPreview").innerHTML = "";
          $("#importFile").value = "";
        }catch(err){ console.error(err); toast("Import failed. Please check your connection.","error"); }
        finally{ setBtnLoading(btn,false,`<i class="fa-solid fa-cloud-arrow-up"></i> Write to Firestore`); }
      });
    }catch(err){ toast("That file doesn't look like a valid backup.","error"); }
  });
}
